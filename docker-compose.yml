services:
  apnee-live:
    build: .
    container_name: apnee-live
    restart: unless-stopped
    environment:
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
